services:
  postgres:
    image: postgres:16
    container_name: tasks-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tasks}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tasks-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  api:
    image: python:3.12-slim
    container_name: tasks-api
    working_dir: /app
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      PIP_CACHE_DIR: /pip-cache
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - pip_cache:/pip-cache
    command: >
      sh -c "pip install --quiet --root-user-action=ignore -r requirements.txt &&
             alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - app-network
    restart: unless-stopped

  worker:
    image: python:3.12-slim
    container_name: tasks-worker
    working_dir: /app
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      PIP_CACHE_DIR: /pip-cache
    volumes:
      - .:/app
      - pip_cache:/pip-cache
    command: >
      sh -c "pip install --quiet --root-user-action=ignore -r requirements.txt &&
             celery -A workers.celery_app.celery_app worker --loglevel=info --concurrency=2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  pip_cache:

networks:
  app-network:
    driver: bridge
