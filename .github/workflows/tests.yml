name: tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  # a new push to the same branch cancels the previous, still running job
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tasks
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tasks_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET: ci-only-secret
      DEBUG: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        # asyncpg instead of psql: it is already a project dependency, so the job
        # does not rely on a postgresql-client being preinstalled on the runner
        run: |
          python - <<'PY'
          import asyncio

          import asyncpg


          async def main() -> None:
              conn = await asyncpg.connect(
                  "postgresql://postgres:postgres@localhost:5432/postgres"
              )
              try:
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = 'tasks_test'"
                  )
                  if not exists:
                      await conn.execute("CREATE DATABASE tasks_test")
              finally:
                  await conn.close()


          asyncio.run(main())
          PY

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check migrations match models
        run: alembic check

      - name: Run tests
        run: pytest -q
